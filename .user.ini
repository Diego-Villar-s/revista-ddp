; ============================================================
; Limites de PHP (raiz del proyecto) para Railway / PHP-FPM.
; ============================================================
; Complementa public/.user.ini. PHP-FPM busca .user.ini desde el
; directorio del script ejecutado (/app/public) hacia el document
; root (/app), asi que ambos se aplican.
;
; En XAMPP el php.ini del servidor tiene otros valores, por eso
; estos limites solo importan en el despliegue con PHP-FPM.
; ============================================================

upload_max_filesize = 210M
post_max_size = 220M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
