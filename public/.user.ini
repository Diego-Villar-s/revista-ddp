; ============================================================
; Limites de PHP para el despliegue en Railway (PHP-FPM).
; ============================================================
; Railway arranca PHP-FPM con valores por defecto muy bajos
; (2M de subida). Un LoadingImage de 200 MB fallaria con
; "upload_max_filesize" sin cambiar.
;
; El archivo .user.ini lo lee PHP-FPM por directorio, asi que
; este se combina con el de la raiz del proyecto.
; Values alineados con config/config.php:
;   MAX_VIDEO_SIZE  200 MB
;   MAX_FILE_SIZE    50 MB
; ============================================================

upload_max_filesize = 210M
post_max_size = 220M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Sesion: 24 h para el panel de administracion.
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
