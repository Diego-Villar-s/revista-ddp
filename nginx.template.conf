# ============================================================
# DDP Noticias - configuracion Nginx para Railway
# ============================================================
# Railway usa Nginx + PHP-FPM. NO lee .htaccess, asi que este
# archivo reproduce las reglas del .htaccess raiz y sirve el
# front controller de public/index.php.
#
# Railway detecta este archivo en la raiz del proyecto y lo usa
# en lugar de su plantilla por defecto.
#
# Decisiones de diseno (mismas que en el .htaccess de Apache):
#   - El document root es la RAIZ del proyecto (/app), no public/.
#     Asi /uploads/ y /public/ siguen siendo arboles fisicos y las
#     URLs generadas por la aplicacion (PUBLIC_URL, UPLOADS_URL)
#     no necesitan cambiar.
#   - El front controller recibe el parametro ?url=, igual que
#     hacia el RewriteRule de Apache, para que Router no cambie.
# ============================================================

worker_processes auto;
daemon off;
worker_rlimit_nofile 8192;

events {
    worker_connections 1024;
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.php;

    default_type application/octet-stream;
    charset utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] $status '
                    '"$request" $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log  /dev/stdout warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 128;

    # Limite de subida: el admin admite video de hasta 200 MB
    # (MAX_VIDEO_SIZE en config/config.php).
    client_max_body_size 210M;
    client_body_timeout  300s;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        # Raiz del proyecto: hace visibles /public/ y /uploads/.
        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # ---------------------------------------------------------
        # Bloquea codigo, configuracion y datos privados.
        # Sustituye al RewriteRule ^(?:app|config|database|storage|
        # reference)(?:/|$) - [F,L,NC] del .htaccess de Apache.
        # ---------------------------------------------------------
        location ~ ^/(?:app|config|database|storage|reference|tests?)(?:/|$) {
            deny all;
            return 404;
        }

        # Documentos de trabajo y archivos de control.
        location ~* ^/(?:README|AGENTS|LICENSE)(?:\.[^/]+)?$ {
            deny all;
            return 404;
        }

        # Nunca servir archivos ocultos ni el .env.
        location ~ (?:^|/)\. {
            deny all;
            return 404;
        }

        # .user.ini solo lo lee PHP-FPM; no debe servirse.
        location ~ \.user\.ini$ {
            deny all;
            return 404;
        }

        # Nunca ejecutar codigo dentro de uploads/ (equivalente al
        # uploads/.htaccess). Los binarios subidos son estaticos.
        location /uploads {
            location ~ \.(?:php|phtml|phar|cgi|pl|py|sh|htaccess)$ {
                deny all;
                return 404;
            }
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ---------------------------------------------------------
        # Front controller. El parametro ?url= mantiene el contrato
        # que espera App\Core\Router::parseUrl().
        # ---------------------------------------------------------
        location / {
            try_files $uri $uri/ /public/index.php?url=$uri&$args;
        }

        # Un 404 de nginx debe pasar por la vista propia del sitio.
        error_page 404 /public/index.php?url=/404;

        # ---------------------------------------------------------
        # PHP-FPM
        # ---------------------------------------------------------
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            include       $!{nginx}/conf/fastcgi_params;
            include       $!{nginx}/conf/fastcgi.conf;
            fastcgi_read_timeout 300s;
        }

        # ---------------------------------------------------------
        # Cache de assets con version por filemtime en la URL.
        # ---------------------------------------------------------
        location ~* ^/(?:public/assets|uploads)/.*\.(?:css|js|jpg|jpeg|png|gif|webp|svg|woff2?|ttf|eot|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Imagenes de la aplicacion que viven en public/assets/img.
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Compresion de respuestas de texto.
        gzip on;
        gzip_vary on;
        gzip_min_length 512;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml application/javascript
                   application/json application/xml image/svg+xml;
    }
}
